[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hayat-ai"
version = "0.1.0"
description = "Hayat AI - turn real-life short videos into spoken-language lessons with spaced-repetition memory and daily reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.15",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Download videos/subtitles from TikTok, Instagram, YouTube
video = ["yt-dlp"]
# Local speech-to-text when the video has no subtitles
whisper = ["faster-whisper"]
all = ["yt-dlp", "faster-whisper"]
dev = ["pytest"]

[project.scripts]
hayat = "hayat.cli:main"

[tool.setuptools.packages.find]
include = ["hayat*"]
